name: Build & preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Platform folders are not committed (except our customised files);
      # `flutter create` fills in everything missing and never overwrites existing files.
      - name: Generate platform folders
        run: flutter create --org com.ledgerly --project-name ledgerly --platforms=android,web .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Read version
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BUILD_SHA=${GITHUB_SHA::7} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=BUILD_SHA=${GITHUB_SHA::7} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Add APK + downloads page to the site
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="ledgerly-${VER}-build${{ github.run_number }}.apk"
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk "build/web/downloads/${NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/ledgerly-latest.apk
          cat > build/web/downloads/index.html <<EOF
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Ledgerly downloads</title>
          <body style="font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.6">
          <h1>Ledgerly ${VER}</h1>
          <p>Build ${{ github.run_number }} &middot; commit ${GITHUB_SHA::7}</p>
          <p><a href="${NAME}">Download APK (${NAME})</a></p>
          <p><a href="../">Open the web preview</a></p>
          </body>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-apk-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
