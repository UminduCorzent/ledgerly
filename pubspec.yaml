name: ledgerly
description: "Ledgerly - a fast, private personal finance tracker."
publish_to: "none"

# Keep in sync with lib/core/app_info.dart (AppInfo.version) and CHANGELOG.md.
version: 1.2.0+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  crypto: ^3.0.3
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^10.0.0
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  intl: ^0.20.2
  # Pinned below 3.x: the 2.x authenticate(options: AuthenticationOptions) API is what the code uses.
  local_auth: ^2.3.0
  pdf: ^3.11.0
  provider: ^6.1.2
  share_plus: ^11.0.0
  uuid: ^4.5.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
